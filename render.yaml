services:
  - type: web
    name: jarvis
    runtime: node
    plan: free
    buildCommand: bash render-build.sh && npm --prefix server install --include=dev && npm --prefix web install --include=dev && npm --prefix web run build
    startCommand: npm --prefix server start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ACCESS_TOKEN
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: CHAT_MODEL
        value: gemini-3.8-flash
      - key: VISION_MODEL
        value: gemini-3.8-flash
      - key: STT_MODEL
        value: gemini-3.8-flash
      - key: TTS_MODEL
        value: browser
      - key: TTS_VOICE
        value: tarayici
      - key: USER_NAME
        value: Halil
      - key: WEATHER_CITY
        value: İstanbul
      - key: WEATHER_LAT
        value: "41.01"
      - key: WEATHER_LON
        value: "28.98"
